name: Publish WATTY preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-preview.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Mark preview as latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit v1.0-preview.1 --prerelease=false --latest --title 'WATTY 1.0 Preview 1'
